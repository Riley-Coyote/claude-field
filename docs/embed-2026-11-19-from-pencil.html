<!doctype html>
<html><head><meta charset="utf-8"><title>from pencil</title>
<style>
body{background:#f4f1ea;color:#2a2722;font:15px/1.5 Georgia,serif;margin:0;padding:24px;max-width:860px}
canvas{width:100%;background:#fbf9f4;border:1px solid #d8d2c4;display:block;margin:10px 0}
button{font:inherit;background:#fbf9f4;border:1px solid #a89f8c;padding:5px 12px;margin:0 6px 6px 0;cursor:pointer}
button.on{background:#2a2722;color:#f4f1ea}
.small{font-size:13px;color:#6d665a}
label{margin-right:14px}
</style></head><body>
<h2 style="font-weight:normal;margin:0 0 4px">from pencil</h2>
<div class="small">Upper strip: the marks, as a pencil in the 1960s might have left them. Click a whistle to turn it into a rise, a fall or a level note. Lower strip: what the oscillator actually sang, read back from its own zero crossings.</div>
<canvas id="c" width="1600" height="560"></canvas>
<div>
<button id="tutor" class="on">the tutor (from pencil)</button>
<button id="learned">as the young birds sang it</button>
<button id="play">▶ sing</button>
</div>
<div><label>trill interval <input id="gap" type="range" min="30" max="200" value="75"> <span id="gv">75</span> ms</label>
<span class="small">The trill interval is what varies from place to place.</span></div>
<script>
// from pencil — a toy chingolo from a few pencil marks.
// The source is a self-sustained oscillator (van der Pol), standing in for the
// syringeal labia: "pressure" decides whether it sounds at all, "tension" sets
// its pitch. In the spirit of Mindlin's models, not their equations.

const SR = 44100;

// A song is a list of marks, as a pencil would write them.
//   {kind:'rise'|'fall'|'flat', lo, hi, dur}  — an introductory whistle (Hz, s)
//   {kind:'trill', lo, hi, n, gap}           — n descending syllables, gap = interval (s)
function gestures(song) {
  // turn marks into a timeline of segments: [t0, t1, f0, f1, on]
  const segs = []; let t = 0.05;
  for (const m of song) {
    if (m.kind === 'trill') {
      const syl = Math.min(0.6 * m.gap, 0.05);
      for (let i = 0; i < m.n; i++) {
        segs.push([t, t + syl, m.hi, m.lo, 1]);
        t += m.gap;
      }
      t += 0.05;
    } else {
      const f0 = m.kind === 'rise' ? m.lo : m.hi;
      const f1 = m.kind === 'fall' ? m.lo : m.kind === 'rise' ? m.hi : m.hi;
      segs.push([t, t + m.dur, f0, f1, 1]);
      t += m.dur + 0.07;
    }
  }
  return { segs, total: t + 0.1 };
}

function sing(song) {
  const { segs, total } = gestures(song);
  const N = Math.floor(total * SR);
  const out = new Float32Array(N);
  const freq = new Float32Array(N); // the instruction, kept for drawing
  // per-sample instruction
  let si = 0;
  for (let i = 0; i < N; i++) {
    const t = i / SR;
    while (si < segs.length && t > segs[si][1]) si++;
    if (si < segs.length && t >= segs[si][0]) {
      const [a, b, f0, f1] = segs[si];
      const u = (t - a) / (b - a);
      freq[i] = f0 * Math.pow(f1 / f0, u); // glides are log-linear
    } else freq[i] = 0;
  }
  // the labia: x'' - mu(beta - x^2) x' + w^2 x = 0, with a little damping when beta<0
  let x = 1e-3, v = 0, beta = -1, w = 2 * Math.PI * 4000, env = 0;
  const sub = 8, dt = 1 / (SR * sub);
  for (let i = 0; i < N; i++) {
    const target = freq[i] > 0 ? 1 : -1;
    beta += (target - beta) * 0.004;           // pressure can't jump
    if (freq[i] > 0) w += (2 * Math.PI * freq[i] - w) * 0.02; // nor can tension
    for (let s = 0; s < sub; s++) {
      const mu = 0.06 * w;                       // scaled so onset takes ~ a few ms
      const a = mu * (beta - x * x) * v - w * w * x;
      v += a * dt; x += v * dt;
    }
    if (Math.abs(x) < 1e-6 && beta > 0) x = 1e-4;  // a breath of noise to restart
    out[i] = x;
  }
  // light normalisation + soft edges
  let peak = 1e-9; for (const s of out) peak = Math.max(peak, Math.abs(s));
  for (let i = 0; i < N; i++) out[i] = 0.8 * out[i] / peak;
  return { out, freq, total, segs };
}

// what the oscillator actually did: frequency from zero crossings
function track(out, win = 0.004) {
  const W = Math.floor(win * SR), pts = [];
  for (let i = 0; i + W < out.length; i += W) {
    let zc = 0, e = 0;
    for (let j = i + 1; j < i + W; j++) {
      if ((out[j - 1] < 0) !== (out[j] < 0)) zc++;
      e += out[j] * out[j];
    }
    pts.push([i / SR, zc / 2 / win, Math.sqrt(e / W)]);
  }
  return pts;
}

// Two versions of one song. The pencil marks are invented in the shape the
// articles describe (2–4 whistles, then a descending trill, about two seconds);
// the only real fact encoded is the difference between them.
const TUTOR = [
  { kind: 'flat', lo: 4200, hi: 4200, dur: 0.22 },
  { kind: 'fall', lo: 3400, hi: 5600, dur: 0.20 },
  { kind: 'rise', lo: 3600, hi: 6000, dur: 0.20 },
  { kind: 'fall', lo: 3300, hi: 5200, dur: 0.20 },
  { kind: 'trill', lo: 3000, hi: 5000, n: 7, gap: 0.075 },
];
// what the young birds made of it: the final falling syllable spans more,
// as every adult in the park already sang it.
const LEARNED = TUTOR.map((m, i) => i === 3 ? { ...m, lo: 2600, hi: 6400 } : m);

if (false && typeof module !== 'undefined') module.exports = { sing, track, TUTOR, LEARNED, SR, gestures };

const cv=document.getElementById('c'),g=cv.getContext('2d');
let which='tutor', song=JSON.parse(JSON.stringify(TUTOR)), last=null, ac=null, playStart=0, playing=false;
function current(){
  const base = which==='tutor'?song:song.map((m,i)=>i===3?{...m,lo:2600,hi:6400}:m);
  return base;
}
const FMIN=1500,FMAX=8000;
function fy(f,top,h){return top+h-(Math.log(f/FMIN)/Math.log(FMAX/FMIN))*h;}
function render(){
  last=sing(current());
  const tr=track(last.out,0.003), W=cv.width, T=last.total;
  g.clearRect(0,0,W,cv.height);
  const tx=t=>40+(t/T)*(W-80);
  // pencil strip
  g.strokeStyle='#5a544a';g.lineWidth=3;g.lineCap='round';
  last.segs.forEach(([a,b,f0,f1])=>{
    const x0=tx(a),x1=tx(b),y0=fy(f0,20,200),y1=fy(f1,20,200);
    g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
    if(Math.abs(y1-y0)>4&&b-a>0.1){const d=Math.sign(y1-y0);g.beginPath();g.moveTo(x1,y1);g.lineTo(x1-12,y1-d*4);g.moveTo(x1,y1);g.lineTo(x1-4,y1-d*14);g.stroke();}
  });
  g.fillStyle='#8a8272';g.font='22px Georgia';g.fillText('pencil',40,250);
  g.strokeStyle='#d8d2c4';g.lineWidth=1;g.beginPath();g.moveTo(0,270);g.lineTo(W,270);g.stroke();
  // oscillator strip
  for(const [t,f,e] of tr){ if(e<0.03||f<FMIN||f>FMAX) continue;
    g.fillStyle=`rgba(42,39,34,${Math.min(1,e*1.6)})`;g.fillRect(tx(t),fy(f,290,220)-2,3,4); }
  g.fillStyle='#8a8272';g.fillText('oscillator',40,545);
  if(playing&&ac){const t=ac.currentTime-playStart; if(t<T){g.strokeStyle='#b5482f';g.beginPath();g.moveTo(tx(t),0);g.lineTo(tx(t),cv.height);g.stroke();requestAnimationFrame(render2);} else playing=false;}
}
function render2(){render();}
cv.addEventListener('click',ev=>{
  if(!last) return; const r=cv.getBoundingClientRect(), x=(ev.clientX-r.left)*cv.width/r.width;
  const T=last.total, t=(x-40)/(cv.width-80)*T;
  // which whistle (first four segments correspond to the four intro marks)
  for(let i=0;i<4;i++){const [a,b]=last.segs[i]; if(t>=a-0.03&&t<=b+0.03){
    const k=['rise','fall','flat'], m=song[i]; m.kind=k[(k.indexOf(m.kind)+1)%3]; render(); return;}}
});
function sel(w){which=w;document.getElementById('tutor').className=w==='tutor'?'on':'';document.getElementById('learned').className=w==='learned'?'on':'';render();}
document.getElementById('tutor').onclick=()=>sel('tutor');
document.getElementById('learned').onclick=()=>sel('learned');
const gap=document.getElementById('gap');
gap.oninput=()=>{document.getElementById('gv').textContent=gap.value;song[4].gap=gap.value/1000;render();};
document.getElementById('play').onclick=()=>{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  render(); const buf=ac.createBuffer(1,last.out.length,SR); buf.copyToChannel(last.out,0);
  const s=ac.createBufferSource(); s.buffer=buf;
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=9000; // soften the upper harmonics a little
  const gn=ac.createGain(); gn.gain.value=0.5;
  s.connect(lp).connect(gn).connect(ac.destination); playStart=ac.currentTime; playing=true; s.start(); render();
};
render();
</script></body></html>
